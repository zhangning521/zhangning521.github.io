<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#218478"><title>课间与我们 · 我的日常空间</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f7;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#344c42}.portal-bar{height:58px;background:#fcfdfc;border-bottom:1px solid #e4ece7;display:flex;align-items:center;padding:0 25px;gap:24px}.portal-brand{font-size:15px;font-weight:600;letter-spacing:1px;color:#267e6e;white-space:nowrap}.portal-brand span{font-size:11px;color:#a1ada6;margin-left:9px;font-weight:400;letter-spacing:0}.tabs{display:flex;gap:6px}.tabs button{cursor:pointer;border:0;background:transparent;padding:8px 14px;border-radius:8px;color:#83968b;font:inherit}.tabs button.active{background:#e6f2eb;color:#227d6c}.portal-note{margin-left:auto;font-size:10px;color:#9caaa2}iframe{display:block;width:100%;height:calc(100dvh - 58px);border:0}button:focus-visible{outline:3px solid #a0cfc4;outline-offset:2px}@media(max-width:650px){.portal-bar{height:94px;padding:12px 16px;gap:8px;align-items:flex-start;flex-direction:column}.portal-brand span,.portal-note{display:none}.tabs{width:100%;justify-content:space-between}.tabs button{padding:7px 13px;font-size:12px}iframe{height:calc(100dvh - 94px)}}
@media(max-width:760px){html,body{height:100%;overflow:hidden}body{display:flex;flex-direction:column;height:100dvh}.portal-bar{height:auto;min-height:84px;flex:none;align-items:stretch;flex-direction:column;gap:4px;padding:8px 12px}.portal-brand{font-size:14px;line-height:20px;letter-spacing:1px}.portal-brand span,.portal-note{display:none}.tabs{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.tabs button{min-height:40px;padding:8px 5px;font-size:13px;border-radius:8px}iframe{flex:1;min-height:0;width:100%;height:auto}}
</style></head><body><header class="portal-bar"><div class="portal-brand">课间与我们<span>把日常过成喜欢的样子</span></div><nav class="tabs" aria-label="切换页面"><button data-page="workbench" class="active">教学工作台</button><button data-page="together">我们的生活</button><button data-page="album">旧相册</button></nav><span class="portal-note">给教学一点秩序，给生活一点浪漫。</span></header><iframe id="page-frame" title="教学工作台" allow="autoplay"></iframe><script>
const pages={workbench:['./workbench.html','教学工作台'],together:['./together.html','我们的生活'],album:['./album.html','樱花音乐相册']};
// A fresh HTML address on each visit prevents an old cached iframe surviving a homepage reload.
const pageVersion=Date.now().toString(36);
function openPage(name){if(!pages[name])name='workbench';const url=new URL(pages[name][0],location.href);url.searchParams.set('v',pageVersion);document.querySelector('#page-frame').src=url.href;document.querySelector('#page-frame').title=pages[name][1];document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===name);b.setAttribute('aria-current',b.dataset.page===name?'page':'false');});history.replaceState(null,'','#'+name);}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)openPage(b.dataset.page);});window.addEventListener('hashchange',()=>openPage(location.hash.slice(1)));openPage(location.hash.slice(1));
</script></body></html>
