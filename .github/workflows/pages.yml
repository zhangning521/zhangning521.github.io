name: Sync Feishu and deploy Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tools/check.cjs && node tools/check-calendar-sync.cjs && node tools/check-invoices.cjs && python -m unittest discover -s tools -p 'test_*.py'
      - run: node tools/package-pages.cjs
      - name: Read CalDAV and encrypt snapshot
        timeout-minutes: 7
        env:
          FEISHU_CALDAV_USERNAME: ${{ secrets.FEISHU_CALDAV_USERNAME }}
          FEISHU_CALDAV_PASSWORD: ${{ secrets.FEISHU_CALDAV_PASSWORD }}
          CALENDAR_PASSPHRASE: ${{ secrets.CALENDAR_PASSPHRASE }}
          TZ: Asia/Shanghai
        shell: bash
        run: |
          if [ -z "$FEISHU_CALDAV_USERNAME$FEISHU_CALDAV_PASSWORD$CALENDAR_PASSPHRASE" ]; then
            echo '::notice::CalDAV Secrets are not configured yet. Publishing the website without a new snapshot.'
            python tools/cloud-feishu.py --retain-published
          else
            python tools/cloud-feishu.py --output "$RUNNER_TEMP/calendar.private.json"
            node tools/encrypt-calendar.cjs "$RUNNER_TEMP/calendar.private.json" _site/calendar/feishu.enc.json
          fi
      - name: Load Feishu task authorization
        id: task_auth
        continue-on-error: true
        env:
          FEISHU_TASK_AUTH: ${{ secrets.FEISHU_TASK_AUTH }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          if [ -z "$FEISHU_TASK_AUTH" ]; then exit 0; fi
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
          name=$(node tools/feishu-tasks.cjs name)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          previous=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name="$name" -f per_page=100 | jq -r --argjson repo "$REPOSITORY_ID" '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main" and .workflow_run.head_repository_id == $repo)] | max_by(.id) | .workflow_run.id // empty')
          if [ -n "$previous" ]; then
            gh run download "$previous" --name "$name" --dir "$RUNNER_TEMP/feishu-task-auth"
          fi
          node tools/feishu-tasks.cjs refresh "$RUNNER_TEMP/feishu-task-auth" "$RUNNER_TEMP/feishu-task-rotated"
      - name: Save rotated Feishu task authorization
        id: task_auth_save
        if: steps.task_auth.outcome == 'success' && steps.task_auth.outputs.name != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.task_auth.outputs.name }}
          path: ${{ runner.temp }}/feishu-task-rotated/authorization.enc.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Read and encrypt Feishu tasks
        id: tasks
        if: steps.task_auth.outcome == 'success' && steps.task_auth_save.outcome == 'success'
        timeout-minutes: 3
        continue-on-error: true
        env:
          FEISHU_TASK_AUTH: ${{ secrets.FEISHU_TASK_AUTH }}
          CALENDAR_PASSPHRASE: ${{ secrets.CALENDAR_PASSPHRASE }}
        run: |
          state="$RUNNER_TEMP/feishu-task-auth"
          if [ -f "$RUNNER_TEMP/feishu-task-rotated/authorization.enc.json" ]; then
            state="$RUNNER_TEMP/feishu-task-rotated"
          fi
          mkdir -p _site/calendar
          node tools/feishu-tasks.cjs snapshot "$state" "$RUNNER_TEMP/feishu-tasks.enc.json"
          mv "$RUNNER_TEMP/feishu-tasks.enc.json" _site/calendar/feishu-tasks.enc.json
      - name: Retain last Feishu task snapshot
        if: steps.task_auth.outputs.enabled == 'true' && steps.tasks.outcome != 'success'
        run: |
          echo '::warning::飞书任务同步失败，保留上次快照，继续发布日历。'
          python tools/cloud-feishu.py --retain-published-tasks
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
